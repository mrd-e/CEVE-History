name: 天书自动收录

on:
  workflow_dispatch:
    inputs:
      test_translation:
        description: '仅用一段样文测试订阅、翻译与独立复核'
        type: boolean
        default: false

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/checkout@v5
        with:
          repository: mrd-e/EVE-Online-Translation-Framework
          token: ${{ secrets.TRANSLATOR_READ_TOKEN }}
          persist-credentials: false
          path: translator
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 检查订阅
        id: scan
        if: inputs.test_translation != true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/ci-news/sync.py scan
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          state = json.loads(Path(".github/news-state.json").read_text(encoding="utf-8"))
          retry = state.get('modelRetryAfter')
          cooling = retry and datetime.fromisoformat(retry.replace('Z', '+00:00')) > datetime.now(timezone.utc)
          print(f"pending={0 if cooling else len(state['pending'])}")
          PY
      - name: 离线验证收录与恢复协议
        if: inputs.test_translation == true || (steps.scan.outcome == 'success' && steps.scan.outputs.pending != '0')
        run: python -m unittest discover -s scripts/ci-news -p 'test_*.py'
      - name: 恢复已完成的翻译阶段
        if: steps.scan.outcome == 'success' && steps.scan.outputs.pending != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci-news/sync.py restore
      - uses: actions/setup-node@v5
        if: steps.scan.outcome == 'success' && steps.scan.outputs.pending != '0'
        with:
          node-version: 22
          cache: npm
      - if: steps.scan.outcome == 'success' && steps.scan.outputs.pending != '0'
        run: npm ci
      - name: 翻译、独立复核，一次提交并请求部署
        id: publish
        if: steps.scan.outcome == 'success' && steps.scan.outputs.pending != '0'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci-news/sync.py publish
      - name: 测试订阅与翻译复核
        if: inputs.test_translation == true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python scripts/ci-news/sync.py smoke
      - name: 保存翻译成果、复核意见与调用诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translator-jobs-${{ github.run_id }}-${{ github.run_attempt }}
          path: translator/jobs/
          retention-days: 14
          if-no-files-found: ignore
      # 没走到收录时（无待办、额度冷却或前置步骤失败）由这里提交扫描结果并补发部署；
      # 收录一旦开始，提交只由收录自己完成，避免把未提交页面的状态单独推上去。
      - name: 未收录时保存订阅状态并补发部署
        if: always() && steps.scan.outcome == 'success' && steps.publish.outcome == 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci-news/sync.py finish
